name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry.itlusions.com
        uses: docker/login-action@v4
        with:
          registry: registry.itlusions.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Derive version from tag
        id: version
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            registry.itlusions.com/itlusions/itl-controlplane-portal:${{ steps.version.outputs.version }}
            registry.itlusions.com/itlusions/itl-controlplane-portal:latest
